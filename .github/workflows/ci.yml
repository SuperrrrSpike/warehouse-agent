name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q main.py warehouse_agent tests
      - run: python main.py validate-model
      - run: python main.py bootstrap --start-date 2026-07-24 --days 7 --seed 42 --force
      - run: python main.py validate
